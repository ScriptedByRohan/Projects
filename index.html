<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="main">
      <div class="HCJ">
        <p>H C J</p>
      </div>
      <div class="header">
        <h2 class="project_title">Price Range slider</h2>
      </div>
      <div class="price-input-container">
        <div class="price-input">
          <div class="price-field">
            <span>Minimum Price</span>
            <input type="number" value="2500" class="min-input" />
          </div>
          <div class="price-field">
            <span>Maximum Price</span>
            <input type="number" value="8000" class="max-input" />
          </div>
        </div>

        <div class="slider">
          <div class="price-slider">
            <input
              type="range"
              class="min-range"
              min="0"
              max="10000"
              value="2500"
              step="1"
            />
            <input
              type="range"
              class="max-range"
              min="0"
              max="10000"
              value="8500"
              step="1"
            />
          </div>
        </div>
      </div>
      <div class="range-input"></div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
